name: Update schedules
on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch: {}
permissions:
  contents: write
jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install requests beautifulsoup4 playwright && playwright install --with-deps chromium
      - run: python scraper/scrape.py
        continue-on-error: true
      - name: Commit changes
        run: |
          git config user.name "schedule-bot"
          git config user.email "bot@users.noreply.github.com"
          git add schedule.json schedule.js
          git diff --cached --quiet || git commit -m "Update schedules"
          git push
